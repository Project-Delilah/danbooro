name: danbooro
description: "A Flutter Android app for browsing Danbooru content with a smooth, infinite-scroll binge experience."
publish_to: 'none'

version: 1.0.3+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.4.0
  dio_cache_interceptor: ^3.4.4
  connectivity_plus: ^5.0.2

  # State Management
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^13.0.0

  # UI
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.14.0
  shimmer: ^3.0.0

  # Media
  video_player: ^2.8.1

  # Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0

  # Utilities
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1


flutter_launcher_icons:
  android: true
  image_path_android: "assets/android-flutter-icon-full.png"
  adaptive_icon_background: "assets/android-flutter-icon-background.png"
  adaptive_icon_foreground: "assets/android-flutter-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
